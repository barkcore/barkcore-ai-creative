<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>在庫管理デモ（仮データ）</title>
<style>
:root{--ink:#1E2A33;--muted:#5B6770;--line:#D5DADF;--accent:#0F5C7A;--warn:#B3261E;--off:#C9D0D5;--bg:#fff;--pad:96px}
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Yu Gothic UI","Meiryo","Hiragino Sans","Noto Sans JP",IPAGothic,sans-serif;line-height:1.5;font-variant-numeric:tabular-nums}
.skip{position:absolute;left:-999px;top:0;background:var(--accent);color:#fff;padding:8px 14px}
.skip:focus{left:8px;top:8px;z-index:10}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top,main,footer{padding-left:var(--pad);padding-right:var(--pad);max-width:1440px;margin-left:auto;margin-right:auto}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding-top:28px;border-bottom:1px solid var(--line)}
.brand{font-size:20px;font-weight:700;padding-bottom:20px}
.brand small{font-weight:400;color:var(--muted);font-size:15px;margin-left:14px}
nav{display:flex;gap:40px;font-size:18px}
nav a{color:var(--muted);text-decoration:none;padding-bottom:17px;border-bottom:3px solid transparent}
nav a[aria-current=page]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
nav a:hover{color:var(--ink)}
nav b{color:var(--accent);margin-left:6px}
main{padding-top:44px;padding-bottom:64px;min-height:70vh}
main:focus{outline:none}
h1{font-size:32px;margin:0 0 20px;line-height:1.3}
h1:focus{outline:none}
h1,h2{text-wrap:balance}
p{text-wrap:pretty}
.live{position:absolute;left:-999px;width:1px;height:1px;overflow:hidden}
.pg{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:72px}
.search{display:block;width:min(760px,100%);height:72px;border:2px solid var(--accent);padding:0 24px;font-size:28px;background:#fff;border-radius:0}
.hint{margin:14px 0 0;font-size:17px;color:var(--muted)}
.legend{margin:30px 0 0;font-size:17px;color:var(--muted);line-height:1.7}
.legend b{color:var(--ink)}
.prod{margin-top:30px}
.prod h2{font-size:24px;margin:0 0 6px}
.prod h2 span{font-weight:400;color:var(--muted);font-size:18px;margin-left:12px}
.sum{font-size:18px;color:var(--muted);margin-bottom:12px}
.sum b{color:var(--ink)}
.sum .can,.can{color:var(--accent);font-weight:700}
table{border-collapse:collapse;width:100%;font-size:20px}
caption{text-align:left}
th{font-size:16px;font-weight:400;color:var(--muted);text-align:left;padding:8px 0;border-bottom:1px solid var(--ink)}
td{padding:14px 0;border-bottom:1px solid var(--line);vertical-align:middle}
.n{text-align:right;padding-right:28px}
td.bot{font-size:28px;font-weight:700}
td.n.can{font-size:28px}
td.n.dim{color:var(--muted)}
.btn{display:inline-block;background:var(--accent);color:#fff;border:1.5px solid var(--accent);font-size:18px;padding:9px 22px;border-radius:4px;cursor:pointer;line-height:1.4}
.btn.sub{background:#fff;color:var(--accent)}
.btn[disabled],.btn[aria-disabled=true]{background:var(--off);border-color:var(--off);color:#fff;cursor:not-allowed}
.btn.sub[disabled]{background:#fff;color:#8a949c;border-color:var(--off)}
.lnk{background:none;border:0;color:var(--accent);text-decoration:underline;font-size:17px;padding:8px 6px;cursor:pointer}
.side{border-left:1px solid var(--line);padding-left:32px;align-self:start}
.side h2{font-size:18px;margin:0 0 14px}
.side p{margin:0 0 10px;font-size:17px;line-height:1.6}
.side .big{font-size:30px;font-weight:700}
.empty{margin-top:48px;font-size:22px;line-height:1.8}
.empty .ex{color:var(--muted);font-size:18px;margin-top:14px}
.qty{display:flex;align-items:center;flex-wrap:wrap;gap:14px;padding:6px 0 6px}
.qty label{font-size:16px;color:var(--muted)}
.qty input{width:110px;height:52px;border:2px solid var(--accent);font-size:26px;padding:0 14px;text-align:right;border-radius:0;background:#fff}
.qty input[aria-invalid=true]{border-color:var(--warn)}
.err{color:var(--warn);font-size:18px;font-weight:700;margin-top:8px}
.toast{font-size:18px;color:var(--accent);font-weight:700;margin:0 0 30px}
.toast.bad{color:var(--warn)}
.fields{display:flex;flex-wrap:wrap;gap:24px 56px;margin:8px 0}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:16px;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid #8a949c;background:#fff;padding:10px 14px;font-size:20px;min-width:260px;border-radius:0}
.f input[aria-invalid=true]{border:2px solid var(--warn)}
.f input[readonly]{background:#F2F4F5}
.f .help{font-size:15px;color:var(--muted)}
.f .err{margin-top:2px;font-size:16px}
.act{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-top:36px}
.note{font-size:17px;color:var(--muted);margin-top:14px}
.ban{margin-top:48px;font-size:20px;font-weight:700}
.sec{margin-top:56px}
.sec h2{font-size:22px;margin:0 0 10px}
select.pick{font-size:20px;padding:8px 10px;border:1px solid #8a949c;background:#fff;border-radius:0}
dialog{border:2px solid var(--ink);padding:28px 32px;width:min(560px,92vw);border-radius:0}
dialog::backdrop{background:rgba(30,42,51,.45)}
dialog h2{margin:0 0 6px;font-size:24px}
.dl{font-size:18px;color:var(--muted);margin:0 0 16px}
#storage-warn{background:#FFF3F2;color:var(--warn);font-weight:700;padding:10px var(--pad);font-size:17px}
footer{padding-top:24px;padding-bottom:40px;border-top:1px solid var(--line);font-size:15px;color:var(--muted);display:flex;flex-wrap:wrap;gap:12px 32px;align-items:center}
.cf{display:inline-flex;gap:12px;align-items:center;color:var(--ink);font-size:17px}
#printArea{display:none}
@media (max-width:1180px){:root{--pad:48px}.pg{grid-template-columns:minmax(0,1fr);gap:32px}.side{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:20px}}
@media (max-width:760px){
  :root{--pad:16px}
  html{-webkit-text-size-adjust:100%}
  button,a,input,select{touch-action:manipulation}
  .top{flex-direction:column;align-items:stretch;gap:0;padding-top:14px}
  .brand{font-size:18px;padding-bottom:6px}
  .brand small{display:block;margin:0;font-size:13px}
  nav{gap:0;font-size:16px;justify-content:space-between}
  nav a{flex:1 1 0;text-align:center;white-space:nowrap;padding:12px 2px 11px}
  nav b{margin-left:3px}
  main{padding-top:24px;padding-bottom:40px}
  h1{font-size:26px;margin-bottom:14px}
  .search{height:64px;font-size:22px;padding:0 16px}
  .prod h2{font-size:22px}.prod h2 span{display:block;margin:2px 0 0}
  .sum{font-size:17px;line-height:1.7}
  .legend{font-size:16px}
  .btn{min-height:48px;padding:10px 20px}
  .lnk{min-height:44px;padding:10px 8px}
  .act{gap:12px}
  .act>.btn,.act>a.btn{flex:1 1 100%;text-align:center}
  .qty{gap:10px}.qty label{flex:1 1 100%}
  .qty input{width:120px;height:56px}
  .qty .btn{flex:1 1 40%}
  .fields{gap:16px}
  .f,.f input,.f select{width:100%;min-width:0}
  .f input,.f select,.f textarea{font-size:18px;min-height:48px}
  select.pick{width:100%;min-height:48px;font-size:18px}
  .side{padding-top:16px}
  dialog{padding:20px 18px}
  #askMsg{font-size:18px!important}
  footer{flex-direction:column;align-items:flex-start;gap:8px}
  /* 表を1行ずつの縦読みにする */
  table.rt{display:block;font-size:18px}
  table.rt thead{position:absolute;left:-999px;width:1px;height:1px;overflow:hidden}
  table.rt tbody{display:block}
  table.rt tr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 12px;padding:14px 0;border-bottom:1px solid var(--line)}
  table.rt td{display:block;border:0;padding:0;min-width:0;overflow-wrap:anywhere}
  table.rt td[data-label]::before{content:attr(data-label);display:block;font-size:13px;color:var(--muted);font-weight:400;line-height:1.4}
  table.rt td.full{grid-column:1/-1}
  table.rt td.n{text-align:left;padding-right:0}
  table.rt td.bot{font-size:28px;grid-column:1/2;white-space:nowrap}
  table.rt td.dt{grid-column:2/4;align-self:end}
  table.rt td.n.can{font-size:28px}
  table.rt td.ac{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px}
  table.rt td.ac .btn{flex:1 1 100%;text-align:center}
  table.rt tr.edrow{display:block}
  table.rt tr.edrow td{display:block}
  table.rt.cf2 tr{grid-template-columns:repeat(2,minmax(0,1fr))}
  table.rt.pl tr{grid-template-columns:minmax(0,.75fr) minmax(0,1.75fr) minmax(0,.6fr)}
}
/* 印刷 */
.sheet{font-size:13pt;color:#000}
.sheet h1{font-size:22pt;margin:0 0 6mm}
.sheet .meta{display:flex;gap:14mm;margin-bottom:8mm;font-size:13pt}
.sheet .meta span{display:block;font-size:10pt;color:#333}
.sheet table{font-size:13pt;width:100%}
.sheet th{color:#000;font-size:11pt;border-bottom:2px solid #000}
.sheet td{padding:5mm 0;border-bottom:1px solid #666}
.sheet td.pb{font-size:24pt;font-weight:700}
.sheet .box{display:inline-block;width:8mm;height:8mm;border:1.5px solid #000}
.sheet .foot{margin-top:10mm;font-size:10pt;color:#333}
@media print{
  @page{size:A4;margin:16mm}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<a class="skip" href="#main">本文へ移動</a>
<header class="top"><div class="brand">在庫管理<small>デモ（仮データ）</small></div><nav id="nav" aria-label="メニュー"></nav></header>
<div id="storage-warn" role="alert" hidden>この環境では保存できません。画面を閉じると入力した内容は消えます。</div>
<main id="main" tabindex="-1"></main>
<footer>
  <span>これはデモです。データは仮のもので、入力した内容はこのPCのこのブラウザにだけ保存されます。</span>
  <span><button type="button" class="lnk" id="resetBtn">仮データに戻す</button></span>
</footer>

<dialog id="fix" aria-labelledby="fixTitle">
  <form method="dialog" id="fixForm" novalidate>
    <h2 id="fixTitle">在庫の訂正</h2>
    <p class="dl" id="fixInfo"></p>
    <div class="fields">
      <div class="f"><label for="fixQty">訂正後の在庫（本）</label><input id="fixQty" inputmode="numeric" autocomplete="off" aria-describedby="fixQtyHelp fixQtyErr"><span class="help" id="fixQtyHelp"></span><span class="err" id="fixQtyErr" role="alert"></span></div>
      <div class="f" style="flex:1 1 100%"><label for="fixWhy">訂正の理由（必ず書いてください）</label><input id="fixWhy" required aria-required="true" autocomplete="off" style="width:100%" aria-describedby="fixWhyErr" placeholder="例：数え直したら1本少なかった"><span class="err" id="fixWhyErr" role="alert"></span></div>
    </div>
    <div class="act"><button type="submit" class="btn" id="fixGo">訂正する</button><button type="button" class="btn sub" id="fixCancel">やめる</button></div>
  </form>
</dialog>
<dialog id="ask" role="alertdialog" aria-labelledby="askMsg"><p id="askMsg" style="font-size:20px;margin:0 0 20px"></p><div class="act" style="margin-top:0"><button type="button" class="btn" id="askYes"></button><button type="button" class="btn sub" id="askNo">やめる</button></div></dialog>
<div id="live" class="live" role="status" aria-live="polite"></div>
<div id="printArea" aria-hidden="true"></div>

<script>
(()=>{
'use strict';
const KEY='margon-inventory-demo-v1';
let storageOk=true;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).normalize('NFKC').toLowerCase().replace(/[\s\-‐−–—]/g,'');
const jp=iso=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||'');return m?`${+m[1]}年${+m[2]}月${+m[3]}日`:'';};
const todayIso=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const stamp=iso=>{const d=new Date(iso);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;};
const say=html=>{const t=document.createElement('div');t.innerHTML=html;const l=$('#live');l.textContent='';setTimeout(()=>{l.textContent=t.textContent;},50);};
const focusH1=()=>{const h=$('#h1');if(h)h.focus();};
const toInt=v=>{const s=String(v).normalize('NFKC').trim();return /^\d+$/.test(s)?parseInt(s,10):NaN;};

/* ---------- データ ---------- */
function seed(){
  return {v:1,seq:100,cur:'S1',
    stock:[
      {id:'K1',productNo:'A-1024',name:'サンプル牛A',harvest:'2025-03-12',bottle:'B-03',qty:30},
      {id:'K2',productNo:'A-1024',name:'サンプル牛A',harvest:'2025-06-02',bottle:'C-07',qty:20},
      {id:'K3',productNo:'A-1024-S',name:'サンプル牛A（別ロット）',harvest:'2025-09-10',bottle:'D-02',qty:8},
      {id:'K4',productNo:'A-2210',name:'サンプル牛D',harvest:'2025-08-21',bottle:'E-11',qty:44},
      {id:'K5',productNo:'A-3305',name:'サンプル牛B',harvest:'2025-01-20',bottle:'B-04',qty:12},
      {id:'K6',productNo:'A-3305',name:'サンプル牛B',harvest:'2025-04-15',bottle:'F-01',qty:25},
      {id:'K7',productNo:'A-4120',name:'サンプル牛C',harvest:'2025-05-30',bottle:'G-09',qty:16}
    ],
    ships:[{id:'S1',dest:'サンプル商事（仮）',date:'2026-10-20',status:'draft',lines:[{id:'L1',stockId:'K1',qty:10},{id:'L2',stockId:'K4',qty:20}]}],
    log:[]};
}
let S=load();
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){const d=JSON.parse(raw);if(d&&d.v===1&&Array.isArray(d.stock)&&Array.isArray(d.ships)&&Array.isArray(d.log))return d;}
  }catch(e){storageOk=false;}
  return seed();
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){storageOk=false;}
  $('#storage-warn').hidden=storageOk;
}
const nid=p=>p+(++S.seq);
const byId=id=>S.stock.find(s=>s.id===id);
const drafts=()=>S.ships.filter(x=>x.status==='draft');
const curShip=()=>{const d=drafts();return d.find(x=>x.id===S.cur)||d[0]||null;};
const allocOf=(sid,ignoreLine)=>{let n=0;for(const sh of drafts())for(const l of sh.lines)if(l.stockId===sid&&l.id!==ignoreLine)n+=l.qty;return n;};
const availOf=(sid,ignoreLine)=>{const s=byId(sid);return s?s.qty-allocOf(sid,ignoreLine):0;};
const addLog=(type,text)=>{S.log.unshift({t:new Date().toISOString(),type,text});S.log=S.log.slice(0,60);};
const label=s=>`${s.productNo} 瓶 ${s.bottle}`;
const totalAlloc=()=>drafts().reduce((a,sh)=>a+sh.lines.reduce((b,l)=>b+l.qty,0),0);
const shipTotal=sh=>sh.lines.reduce((a,l)=>a+l.qty,0);

/* ---------- 画面の状態（保存しない） ---------- */
const ui={q:'',open:null,toast:null,expanded:{},editLine:null,cancelLine:null,cancelShip:false,fixId:null,shipErr:'',inToast:null};

/* ---------- 共通部品 ---------- */
function renderNav(route){
  const n=drafts().length;
  const items=[['search','在庫を探す'],['stock-in','入庫'],['prep','出荷の準備'+(n?`<b>${n}件</b>`:'')]];
  const active=route==='confirm'?'prep':route;
  $('#nav').innerHTML=items.map(([k,t])=>`<a href="#${k}"${k===active?' aria-current="page"':''}>${t}</a>`).join('');
}
const main=$('#main');
function setTitle(t){document.title=t+'｜在庫管理デモ（仮データ）';}
function sidePanel(){
  const sh=curShip(),n=drafts().length;
  return `<aside class="side" aria-label="出荷予定"><h2>出荷予定</h2><p class="big">${n}件</p>`+
    (n?`<p>引当中の合計　<b>${totalAlloc()}</b>本</p><p>追加先：<b>${esc(sh.dest||'（出荷先 未入力）')}</b></p><p><a class="lnk" style="padding:0" href="#prep">出荷の準備へ</a></p>`:`<p>まだありません。</p>`)+`</aside>`;
}

/* ---------- 在庫を探す ---------- */
function groups(q){
  const nq=norm(q);if(!nq)return [];
  const m=new Map();
  for(const s of S.stock){
    if(norm(s.productNo).includes(nq)||norm(s.name).includes(nq)){
      if(!m.has(s.productNo))m.set(s.productNo,{productNo:s.productNo,name:s.name,rows:[]});
      m.get(s.productNo).rows.push(s);
    }
  }
  const g=[...m.values()].sort((a,b)=>a.productNo.localeCompare(b.productNo));
  g.forEach(x=>x.rows.sort((a,b)=>a.harvest.localeCompare(b.harvest)||a.bottle.localeCompare(b.bottle)));
  return g;
}
function viewSearch(){
  setTitle('在庫を探す');
  main.innerHTML=`<div class="pg"><div>
    <h1>どの商品を探しますか？</h1>
    <label for="q" class="hint" style="display:block;margin:0 0 8px">製品番号か名前（一部でOK）</label>
    <input id="q" class="search" type="search" autocomplete="off" inputmode="text" placeholder="製品番号か名前を入れてください" value="${esc(ui.q)}" aria-describedby="qhint">
    <p class="hint" id="qhint">入力するたびに結果が出ます。</p>
    <p id="qstat" role="status" style="position:absolute;left:-999px"></p><div id="results"></div>
  </div><div id="sideBox">${sidePanel()}</div></div>`;
  renderResults();
}
function rowHtml(s){
  const al=allocOf(s.id),av=s.qty-al;
  let act;
  if(ui.open===s.id)act='';
  else if(av<=0)act='<span style="color:var(--muted);font-size:17px">引当可能なし</span>';
  else act=`<button type="button" class="btn" data-act="open" data-id="${s.id}" aria-label="${esc(label(s))}を出荷に入れる">出荷に入れる</button>`;
  let h=`<tr><td class="bot" data-label="瓶">${esc(s.bottle)}</td><td class="dt" data-label="採取日">${jp(s.harvest)}</td><td class="n dim" data-label="在庫">${s.qty}</td><td class="n dim" data-label="引当">${al}</td><td class="n can" data-label="引当可能">${av}</td><td class="full ac">${act}<button type="button" class="lnk" data-act="fix" data-id="${s.id}" aria-label="${esc(label(s))}の在庫を訂正">訂正</button></td></tr>`;
  if(ui.open===s.id){
    const dup=curShip()&&curShip().lines.some(l=>l.stockId===s.id);
    const av=s.qty-al;
    h+=`<tr class="edrow"><td colspan="6" class="full" style="padding:10px 0 16px">`+
      (dup?`<div class="err" role="alert">この在庫はすでにこの出荷に入っています。本数を変えるときは<a class="lnk" style="padding:0;font-weight:700" href="#prep">出荷の準備</a>で直してください。</div><div class="qty"><button type="button" class="btn sub" data-act="close">閉じる</button></div>`:
      `<div class="qty"><label for="qtyIn">出荷する本数</label><input id="qtyIn" inputmode="numeric" autocomplete="off" data-id="${s.id}" aria-describedby="qtyErr"><span style="color:var(--muted);font-size:16px">本</span><button type="button" class="btn" id="qtyGo" data-act="add" data-id="${s.id}" disabled aria-describedby="qtyHelp">出荷に入れる</button><button type="button" class="btn sub" data-act="close">やめる</button></div><div id="qtyHelp" class="note" style="margin:6px 0 0">使えるのは最大 ${av}本です。本数を入れると、ボタンが押せるようになります。</div><div class="err" id="qtyErr" role="alert"></div>`)+
      `</td></tr>`;
  }
  return h;
}
function renderResults(){
  const box=$('#results');if(!box)return;
  const g=groups(ui.q);
  let h='';
  if(ui.toast)h+=`<p class="toast${ui.toast.bad?' bad':''}" style="margin-top:24px" role="status">${ui.toast.html}</p>`;
  if(!ui.q.trim()){
    h+=`<div class="empty">入力すると、ここに「どの瓶に何本あるか」が出ます。<div class="ex">例：1024 と入れると、A-1024 の瓶ごとの本数が出ます。</div></div>`;
  }else if(!g.length){

  }else{

    g.forEach((p,i)=>{

      if(!open)h+=`　<button type="button" class="lnk" data-act="expand" data-id="${esc(p.productNo)}">瓶を表示（${p.rows.length}）</button>`;
      h+=`</div>`;

function validateAdd(sid,raw){
  const s=byId(sid),av=availOf(sid);
  if(String(raw).trim()==='')return {ok:false,msg:''};
  const v=toInt(raw);
  if(!(v>=1))return {ok:false,msg:'本数は1以上の数字で入れてください。'};
  if(v>av)return {ok:false,msg:`この瓶で引当できるのは最大 ${av} 本です。本数を直してください。`};
  return {ok:true,v};
}
function updateQtyRow(){
  const inp=$('#qtyIn');if(!inp)return;
  const r=validateAdd(inp.dataset.id,inp.value);
  $('#qtyErr').textContent=r.msg;
  inp.setAttribute('aria-invalid',r.msg?'true':'false');
  $('#qtyGo').disabled=!r.ok;
}
function doAdd(sid){
  const inp=$('#qtyIn');if(!inp||ui.open!==sid)return;
  const r=validateAdd(sid,inp.value);if(!r.ok){updateQtyRow();return;}
  const s=byId(sid);
  let sh=curShip();
  if(!sh){sh={id:nid('S'),dest:'',date:'',status:'draft',lines:[]};S.ships.push(sh);S.cur=sh.id;}
  if(sh.lines.some(l=>l.stockId===sid)){ui.open=sid;renderResults();return;}
  sh.lines.push({id:nid('L'),stockId:sid,qty:r.v});
  addLog('引当',`${label(s)}（採取日 ${jp(s.harvest)}）${r.v}本を出荷予定に入れた`);
  save();
  ui.open=null;
  ui.toast={html:`出荷予定に入れました（${esc(s.productNo)}　瓶 ${esc(s.bottle)}　${r.v}本）　<a class="lnk" style="padding:0" href="#prep">出荷の準備へ</a>`};
  renderResults();say(ui.toast.html);
  const q=$('#q');if(q)q.focus();
}

function setErr(id,msg){const e=$('#'+id+'Err');if(e)e.textContent=msg;const i=$('#'+id);if(i)i.setAttribute('aria-invalid',msg?'true':'false');}
function submitIn(){
  const no=$('#inNo').value.normalize('NFKC').trim().toUpperCase();
  const nm=$('#inName').value.trim();
  const dt=$('#inDate').value;
  const bt=$('#inBottle').value.normalize('NFKC').trim().toUpperCase();
  const qs=$('#inQty').value;const q=toInt(qs);
  const known=S.stock.find(s=>s.productNo===no);
  const name=known?known.name:nm;
  let first=null;
  const chk=(id,msg)=>{setErr(id,msg);if(msg&&!first)first=id;};
  chk('inNo',no?'':'製品番号を入れてください。');
  chk('inName',name?'':'精液の名前を入れてください。');
  chk('inDate',/^\d{4}-\d{2}-\d{2}$/.test(dt)?'':'採取日を選んでください。');
  chk('inBottle',bt?'':'瓶の番号を入れてください。');
  chk('inQty',q>=1?'':'本数は1以上の数字で入れてください。');
  if(first){$('#'+first).focus();return;}
  let row=S.stock.find(s=>s.productNo===no&&s.harvest===dt&&s.bottle===bt);
  let add='';
  if(row){row.qty+=q;add='（既存の在庫に足しました。合計 '+row.qty+'本）';}
  else{row={id:nid('K'),productNo:no,name,harvest:dt,bottle:bt,qty:q};S.stock.push(row);}
  addLog('入庫',`${label(row)}（採取日 ${jp(dt)}）${q}本${add?'を足した':'を入庫'}`);
  save();
  ui.inToast=`入庫しました（${esc(no)}　瓶 ${esc(bt)}　${q}本）${esc(add)}`;
  viewStockIn();say(ui.inToast);
  $('#inNo').focus();
}

function applyEdit(lineId){

}

function doConfirm(id){
  const sh=S.ships.find(x=>x.id===id);

  const bad=sh.lines.find(l=>byId(l.stockId).qty<l.qty);

  const v=toInt($('#fixQty').value),al=allocOf(s.id),why=$('#fixWhy').value.trim();
  let bad=false;
  if(!(v>=0)){setErr('fixQty','0以上の数字で入れてください。');bad=true;}
  else if(v<al){setErr('fixQty',`出荷予定で ${al}本 を取ってあるため、${al}本より少なくはできません。先に出荷の準備で直してください。`);bad=true;}
  else setErr('fixQty','');
  if(!why){setErr('fixWhy','理由を書いてください。');bad=true;}else setErr('fixWhy','');
  if(bad){($('#fixQty').getAttribute('aria-invalid')==='true'?$('#fixQty'):$('#fixWhy')).focus();return;}
  if(v===s.qty){setErr('fixQty','本数が変わっていません。');$('#fixQty').focus();return;}
  addLog('訂正',`${label(s)} ${s.qty}本 → ${v}本（理由：${why}）`);
  const old=s.qty;s.qty=v;save();fix.close();
  ui.toast={html:`訂正しました（${esc(s.productNo)}　瓶 ${esc(s.bottle)}　${old}本 → ${v}本）。履歴は「入庫」の画面で見られます。`};
  route(true);say(ui.toast.html);{const q=$('#q');if(q)q.focus();}
});

/* ---------- イベント ---------- */
main.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  switch(a){
    case 'open':ui.open=id;ui.toast=null;renderResults();{const i=$('#qtyIn');if(i)i.focus();}break;
    case 'close':ui.open=null;renderResults();break;
    case 'expand':ui.expanded[id]=true;renderResults();{const f=[...document.querySelectorAll('#results section')].find(x=>x.getAttribute('aria-label')===id);const bt=f&&f.querySelector('button');if(bt)bt.focus();}break;
    case 'clear':ui.q='';ui.open=null;$('#q').value='';renderResults();$('#q').focus();break;
    case 'add':doAdd(id);break;
    case 'fix':openFix(id);break;
    case 'ledit':ui.editLine=id;ui.cancelLine=null;viewPrep();{const i=$('#edQty');if(i){i.focus();i.select();}}break;
    case 'edcancel':ui.editLine=null;viewPrep();focusH1();break;
    case 'edsave':applyEdit(id);break;
    case 'lcancel':{
      const sh=curShip(),l=sh.lines.find(x=>x.id===id),s0=byId(l.stockId);
      ask(`${s0.productNo} 瓶 ${s0.bottle} の ${l.qty}本を、この出荷から取り消しますか？ 引当が外れます。`,'取り消す',()=>{
        sh.lines=sh.lines.filter(x=>x.id!==id);addLog('引当取消',`${label(s0)} ${l.qty}本の引当を外した`);save();
        ui.toast={html:`取り消しました（${esc(s0.productNo)}　瓶 ${esc(s0.bottle)}　${l.qty}本）。引当が外れました。`,prep:true};viewPrep();say(ui.toast.html);focusH1();});
      break;}
    case 'shipAsk':{
      const sh=curShip();
      ask(`この出荷（${sh.dest||'出荷先 未入力'}　${shipTotal(sh)}本）をすべて取り消しますか？ 引当が外れます。`,'すべて取り消す',()=>{
        addLog('引当取消',`出荷「${sh.dest||'未入力'}」の引当 ${shipTotal(sh)}本をすべて外した`);
        S.ships=S.ships.filter(x=>x.id!==sh.id);S.cur=(drafts()[0]||{}).id||null;save();
        ui.toast={html:'この出荷を取り消しました。引当が外れました。',prep:true};viewPrep();say(ui.toast.html);focusH1();});
      break;}
    case 'newship':{
      const sh={id:nid('S'),dest:'',date:'',status:'draft',lines:[]};S.ships.push(sh);S.cur=sh.id;save();
      ui.shipErr='';ui.toast=null;viewPrep();const i=$('#shDest');if(i)i.focus();break;}
    case 'printPick':doPrint(buildPick(curShip()));break;
    case 'printNotice':doPrint(buildNotice(S.ships.find(x=>x.id===id)));break;
    case 'toConfirm':{
      const sh=curShip();
      if(!sh.dest.trim()){ui.shipErr='出荷先を入れてください。';viewPrep();$('#shDest').setAttribute('aria-invalid','true');$('#shDest').focus();break;}
      if(!sh.date){ui.shipErr='出荷日を入れてください。';viewPrep();$('#shDate').setAttribute('aria-invalid','true');$('#shDate').focus();break;}
      ui.shipErr='';location.hash='#confirm/'+sh.id;break;}
    case 'confirm':b.disabled=true;doConfirm(id);break;
  }
});
main.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){ui.q=t.value;ui.open=null;ui.toast=null;renderResults();}
  else if(t.id==='qtyIn')updateQtyRow();
  else if(t.id==='shDest'){curShip().dest=t.value;ui.shipErr='';const er=$('#shErr');if(er)er.textContent='';t.removeAttribute('aria-invalid');save();}
  else if(t.id==='shDate'){curShip().date=t.value;ui.shipErr='';const er=$('#shErr');if(er)er.textContent='';t.removeAttribute('aria-invalid');save();}
  else if(t.id==='inNo'){
    const no=t.value.normalize('NFKC').trim().toUpperCase(),k=S.stock.find(s=>s.productNo===no),n=$('#inName');
    if(k){n.value=k.name;n.readOnly=true;$('#inNameHelp').textContent='登録済みの製品です。名前は自動で入ります。';}
    else{if(n.readOnly)n.value='';n.readOnly=false;$('#inNameHelp').textContent='';}
  }
});
main.addEventListener('change',e=>{
  if(e.target.id==='shipPick'){S.cur=e.target.value;ui.shipErr='';ui.editLine=null;ui.cancelLine=null;save();viewPrep();}
});
main.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    if(e.target.id==='qtyIn'){e.preventDefault();doAdd(e.target.dataset.id);}
    else if(e.target.id==='edQty'){e.preventDefault();applyEdit($('#edGo').dataset.id);}
  }
});
main.addEventListener('submit',e=>{if(e.target.id==='inForm'){e.preventDefault();submitIn();}});

/* リセット */
$('#resetBtn').addEventListener('click',()=>{
  ask('仮データに戻しますか？ 入力した内容はすべて消えます。','戻す',()=>{
    S=seed();save();ui.q='';ui.open=null;ui.toast=null;ui.inToast=null;ui.editLine=null;ui.shipErr='';
    if(location.hash!=='#search')location.hash='#search';else route(true);
  });
});

/* ---------- ルーティング ---------- */
function route(keepFocus){
  const h=(location.hash||'#search').slice(1);
  const [r,arg]=h.split('/');
  ui.open=null;
  if(r==='stock-in'){renderNav('stock-in');viewStockIn();if(!keepFocus)$('#h1').focus();}
  else if(r==='prep'){ui.editLine=null;ui.cancelLine=null;ui.cancelShip=false;viewPrep();if(!keepFocus){const x=$('#h1');if(x)x.focus();}}
  else if(r==='confirm'){viewConfirm(arg);if(!keepFocus){const x=$('#h1');if(x)x.focus();}}
  else{renderNav('search');viewSearch();const q=$('#q');if(q)q.focus();}
  if(!(r==='search'||(r==='prep'&&ui.toast&&ui.toast.prep)))ui.toast=null;
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>{ui.inToast=location.hash==='#stock-in'?ui.inToast:null;route(false);});
save();
route(false);
})();
</script>
</body>
</html>
